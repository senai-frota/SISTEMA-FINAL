upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads de CNH / vistorias / fotos (alinhado ao limite do Django).
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # API REST — URI completa preservada (sem barra no final do proxy_pass).
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Arquivos estáticos do Django (collectstatic → volume staticfiles)
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Uploads persistentes (volume media, somente leitura neste container)
    location /media/ {
        alias /var/www/media/;
        expires 1d;
        add_header Cache-Control "private";
    }

    # SPA React — fallback para o React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
